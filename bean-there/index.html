<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#263b36">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<title>Bean There</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="brand-mark">bt.</span><div><b>BEAN THERE</b><small>COFFEE HOUSE</small></div></div>
    <div id="stats"></div>
    <div class="top-actions"><span id="shiftState">OPEN</span><button id="upgradesBtn" class="top-btn">⚙ Upgrades</button></div>
  </header>
  <section id="customerArea">
    <div class="customer-heading"><div><b>YOUR CUSTOMERS</b><small>Drag finished cups onto an order to serve</small></div><div id="queueCount">0 / 5</div></div>
    <div id="customers"></div>
  </section>
  <main id="counterViewport" aria-label="Scrollable coffee counter">
    <div id="stations"></div>
  </main>
  <section id="shelf" data-drop="shelf">
    <div class="shelf-title"><b>STORAGE</b><small>Drag equipment to a station</small></div>
    <div id="inventory"></div>
  </section>
</div>
<div id="toast" role="status"></div>
<div id="upgradeModal" class="modal" hidden>
  <div class="modal-card"><div class="modal-head"><div><b>Equipment upgrades</b><small>Improve your coffee shop</small></div><button id="closeUpgrades" class="close-btn">✕</button></div><div id="upgradeList"></div></div>
</div>
<div id="shiftModal" class="modal" hidden>
  <div class="modal-card shift-card"><div class="big-icon">☕</div><h2>Shift complete</h2><p id="shiftSummary"></p><button id="restartShift" class="primary">Open the shop again</button></div>
</div>
<script type="module" src="js/game.js"></script>
</body>
</html>
