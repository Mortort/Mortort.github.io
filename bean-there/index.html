<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2d6a64">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<title>Bean There</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="shop">
  <div id="stats"></div>
  <div id="heldBanner" hidden></div>
  <div id="slots" aria-label="Customers, tap one to serve your cup"></div>
</div>
<div id="counter">
  <div id="stations"></div>
  <div class="panel" id="cupbox">
    <h2>Serving Mat</h2>
    <div id="cup"></div>
    <div id="chips"></div>
    <button id="dump" class="quiet">Dump cup</button>
  </div>
</div>
<div id="toast" role="status"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
